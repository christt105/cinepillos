services:
  cinepillos:
    container_name: cinepillos
    image: ghcr.io/christt105/cinepillos:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:../data/club.db
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    volumes:
      - ./data:/app/data
    ports:
      - "6889:6889"

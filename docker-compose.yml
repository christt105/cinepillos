version: '3.9'

services:
  club-de-cine:
    container_name: club-de-cine
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:../data/club.db
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    volumes:
      - /home/christian/Projects/club-cine/club-de-cine/data:/app/data
      - /home/christian/Projects/club-cine/club-de-cine/public/uploads:/app/public/uploads
    ports:
      - "6889:6889"

  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - club-de-cine
